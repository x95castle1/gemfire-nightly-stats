plugins {
    id 'base'
}

tasks.named('build') {
    dependsOn ':01-embedded-locator:build', ':02-standalone-jmx:build'
}

tasks.register('test') {
    group = 'verification'
    description = 'Run both self-contained example test suites.'
    dependsOn ':01-embedded-locator:test', ':02-standalone-jmx:test'
}

tasks.named('clean') {
    dependsOn ':01-embedded-locator:clean', ':02-standalone-jmx:clean'
}

tasks.register('assembleDist') {
    group = 'distribution'
    description = 'Build ZIP and TAR distributions for both examples.'
    dependsOn ':01-embedded-locator:assembleDist', ':02-standalone-jmx:assembleDist'
}
