plugins {
    id 'java'
    id 'distribution'
}

group = 'com.example.gemfire'
version = '0.0.1-SNAPSHOT'

def gemfireHome = System.getenv('GEMFIRE_HOME')
if (!gemfireHome) {
    throw new GradleException('GEMFIRE_HOME is not set. Point it at a GemFire install.')
}

repositories {
    mavenCentral()
}

dependencies {
    // GemFire provides the runtime libraries; the distribution contains this example's code.
    compileOnly fileTree(dir: "${gemfireHome}/lib", include: '*.jar')
    testImplementation fileTree(dir: "${gemfireHome}/lib", include: '*.jar')
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

test {
    // Deliberately conflicting values prove the collector reads credentials only from properties.
    environment 'JMX_USERNAME', 'ignored-environment-user'
    environment 'JMX_PASSWORD', 'ignored-environment-password'
    environment 'JMX_TOKEN', 'ignored-environment-token'
    environment 'AWS_ACCESS_KEY_ID', 'ignored-environment-key'
    environment 'AWS_SECRET_ACCESS_KEY', 'ignored-environment-secret'
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

jar {
    archiveFileName = "${project.name}.jar"
}

distributions {
    main {
        contents {
            from(tasks.named('jar')) { into 'lib' }
            from('scripts/collect-stats.sh') {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
            from('standalone.properties.example')
            from('README.md')
            from('report-reference.md')
            from('sample-output.json')
            from('docker-compose.yml')
            from('.env.example')
            from('installation') {
                into 'installation'
                exclude '**/*.sh'
            }
            from('installation') {
                into 'installation'
                include '**/*.sh'
                filePermissions { unix('rwxr-xr-x') }
            }
        }
    }
}
