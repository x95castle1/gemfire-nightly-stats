# Installed as /etc/gemfire-nightly-stats/collector.properties.
# Point this VM at an EXISTING cluster. No locator, server or SeaweedFS is started here.
ENV=demo
CLUSTER_NAME=sample-cluster
JMX_HOST=locator.example.internal
JMX_PORT=1099
JMX_TIMEOUT_SECONDS=120

# All collector credentials are configured in this file only.
# Optional JMX authentication:
# JMX_USERNAME=reader
# JMX_PASSWORD=
# Alternatively, use JMX_TOKEN (cannot be combined with username/password).
# JMX_TOKEN=

# The service account owns this state directory. Each collection gets its own JSON file.
REPORT_DIR=/var/lib/gemfire-nightly-stats/reports
REPORT_TIMEZONE=UTC
MIN_FREE_SPACE_MB=100

# local saves reports without contacting S3. Change to s3 to upload each report as well.
DELIVERY_MODE=local
UPLOAD_REQUIRED=false
# Use the S3 server's reachable hostname, not localhost unless it is on this VM.
# S3_ENDPOINT=http://seaweed.example.internal:8333
# S3_BUCKET=gemfire-stats
# S3_REGION=us-east-1
# S3_PREFIX=nightly-stats
# S3 credentials:
# S3_ACCESS_KEY=
# S3_SECRET_KEY=

# For a TLS-enabled JMX manager, uncomment and supply readable stores on this VM.
# gemfire.ssl-enabled-components=jmx
# gemfire.ssl-endpoint-identification-enabled=true
# gemfire.ssl-protocols=TLSv1.2,TLSv1.3
# gemfire.ssl-truststore=/etc/gemfire-nightly-stats/truststore.p12
# gemfire.ssl-truststore-type=PKCS12
# gemfire.ssl-truststore-password=
# For mutual TLS, also provide a client certificate:
# gemfire.ssl-keystore=/etc/gemfire-nightly-stats/client.p12
# gemfire.ssl-keystore-type=PKCS12
# gemfire.ssl-keystore-password=

# Optional calendar schedule, applied to systemd when you run installation/install.sh.
# Example: daily at 10 PM US Central, including daylight-saving changes.
# COLLECTION_CALENDAR=*-*-* 22:00:00 America/Chicago
# Without a calendar, the installer uses --interval-seconds (default: 60).
# A calendar takes precedence over --interval-seconds. Rerun the installer after changing it.
# The Java process remains one-shot; COLLECTION_INTERVAL_SECONDS in this file has no effect.

# Optional installed-service logging, applied by installation/install.sh.
# Rerun the installer after changes. These settings do not configure the direct CLI.
# LOG_DIR must be beneath /var/log; LOG_FILE_NAME is a filename, without a directory.
# LOG_DIR=/var/log/gemfire-nightly-stats
# LOG_FILE_NAME=collector.log
# LOG_ROTATE_INTERVAL=daily
# LOG_ROTATE_SIZE=10M
# LOG_ROTATE_COUNT=14
# Levels: ALL, TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF (case insensitive).
# LOG_LEVEL=INFO
# GEMFIRE_LOG_LEVEL=WARN
