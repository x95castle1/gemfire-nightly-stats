# Local S3 (SeaweedFS) for the nightly stats upload. Start it with `make start`, which creates
# .env from .env.example on first use, or with `docker compose up -d` once .env exists.
# Ports are bound to 127.0.0.1 only:
#   S3 API    http://localhost:8333   (keys: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in .env)
#   Admin UI  http://localhost:23646  (login: WEED_ADMIN_USER / WEED_ADMIN_PASSWORD in .env)

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # mini: master, volume, filer, S3 and Admin UI in one process
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      WEED_ADMIN_USER: ${WEED_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${WEED_ADMIN_PASSWORD:-admin}
      S3_BUCKET: ${S3_BUCKET:-gemfire-stats}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${ADMIN_UI_PORT:-23646}:23646"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8333/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # Explicit opt-in: Ubuntu boots systemd and runs example 02's real VM installer.
  collector-install-test:
    profiles: [installation-test]
    build:
      context: ./examples/02-standalone-jmx/installation/docker
      args:
        UBUNTU_IMAGE: ${INSTALL_TEST_UBUNTU_IMAGE:-ubuntu:24.04}
    privileged: true
    cgroup: host
    network_mode: host
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    environment:
      HOST_EXAMPLE_DIR: ${INSTALL_TEST_SOURCE_DIR:-}
      INSTALL_TEST_INTERVAL_SECONDS: ${INSTALL_TEST_INTERVAL_SECONDS:-30}
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - type: bind
        source: ./examples/02-standalone-jmx
        target: /example
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GEMFIRE_HOME:-./.missing-gemfire-home}
        target: /opt/gemfire
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${INSTALL_TEST_CONFIG:-./examples/02-standalone-jmx/installation/collector.example.properties}
        target: /input/collector.properties
        read_only: true
        bind:
          create_host_path: false
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - collector-install-test-data:/var/lib/gemfire-nightly-stats
      - collector-install-test-logs:/var/log/gemfire-nightly-stats
    healthcheck:
      test: [CMD-SHELL, "systemctl is-active --quiet collector-install-bootstrap.service && systemctl is-active --quiet gemfire-nightly-stats.timer"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  seaweedfs-data:
  collector-install-test-data:
  collector-install-test-logs:
